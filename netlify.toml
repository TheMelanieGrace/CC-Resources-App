# CC Resources App - Netlify configuration
[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# The AI helper's API routes (/api/*) are served by netlify/functions/api.ts,
# which declares its own path in its config export.

# Single-page app: every other path serves the app shell
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
